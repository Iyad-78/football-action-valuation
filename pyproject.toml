[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-action-valuation"
version = "0.2.0"
description = "Explainable football action valuation from event sequences"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Iyad" }]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "tabulate>=0.9,<1",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.3,<5"]
deep-learning = ["torch>=2.2,<3"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
fav = "football_action_valuation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
